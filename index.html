<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PYSCRIPT CDN -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <!-- BOOTSTRAP CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <title>Periodic Table Information Finder</title>

</head>
<body class="bg-info">

    <div class="container mt-5 p-5 w-50 bg-light rounded-5">

        <form>
            <!-- SYMBOL INPUT -->
            <label><b>Element Symbol</b></label><br>
            <input type="text" id="symbol" placeholder="Example: H, O, Cl, N" class="form-control"><br><br>
            
            <!-- BUTTON -->
            <input type="button" py-click="confirm_element" class="btn btn-success form-control" value="Check Element Details">

        </form>

    </div>
    <br><br>

    <div class="container mt-5 p-5 w-50 bg-light rounded-5" id="output"></div>
    
    <py-script src="main.py"></py-script>

</body>
</html>
